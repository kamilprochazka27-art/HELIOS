<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HELIOS 3D Control Center</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
        #hud { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-family: monospace; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #00ffcc; z-index: 999; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="hud">
        <h3>HELIOS Digital Twin</h3>
        <p id="status">Connecting to Colab Streamer...</p>
        <p>Satellites: <span id="satCount">0</span></p>
    </div>

    <script>
        // Zadej svůj Cesium ion token (pokud ho máš, jinak lze nechat výchozí demo)
        Cesium.Ion.defaultAccessToken = 'TVŮJ_CESIUM_TOKEN_ZDE';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain()
        });

        const pinBuilder = new Cesium.PinBuilder();
        const collection = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());

        // WebSocket připojení na tvůj běžící Colab přes localtunnel
        const ws = new WebSocket('wss://tiny-times-visit.loca.lt');

        ws.onopen = () => {
            document.getElementById('status').innerText = 'Connected (Live Stream)';
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            document.getElementById('satCount').innerText = data.satellites.length;
            
            collection.removeAll();
            data.satellites.forEach(sat => {
                // Převod zjednodušených 3D souřadnic na geodetické pozice na globusu
                collection.add({
                    position: Cesium.Cartesian3.fromDegrees(
                        (sat.x % 360) - 180, 
                        Math.max(-85, Math.min(85, sat.y / 100)), 
                        Math.abs(sat.z) * 1000 + 550000
                    ),
                    pixelSize: 4,
                    color: Cesium.Color.CYAN
                });
            });
        };

        ws.onclose = () => {
            document.getElementById('status').innerText = 'Disconnected from Colab';
        };
    </script>
</body>
</html>
